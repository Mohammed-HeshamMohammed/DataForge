name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,web,scraping,scheduler,excel,dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy dataforge
        continue-on-error: true

      # Split so a failure says whether the engine's logic broke or only its
      # behaviour on the real exports did.
      - name: Unit tests
        run: pytest -m "not integration" --cov=dataforge --cov-report=term-missing

      - name: Integration tests (real exports in Data/)
        run: pytest -m integration
