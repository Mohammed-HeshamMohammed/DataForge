name: Release

# Two ways to build a release:
#   1. Push a tag `vX.Y.Z` (or `vX.Y.Z-beta.1`): builds and publishes that version.
#   2. Run this workflow manually (Actions > Release > Run workflow) and type the version to build.
#      You can pick the branch/commit, build without publishing, or build an unsigned installer.
#
# The requested version is stamped into every version file at build time (scripts/set-version.py), so
# nothing has to be bumped and committed first. Signed builds use the "release" environment: configure
# required reviewers there and store TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD as
# environment secrets (never repository secrets). Unsigned builds use the "release-unsigned" environment.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 1.4.0 or 1.4.0-beta.1 (no leading v)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: true
        default: main
        type: string
      publish:
        description: "Publish a GitHub Release and create tag v<version> (off: build only, installer kept as a workflow artifact)"
        required: true
        default: true
        type: boolean
      signed:
        description: "Sign updater artifacts and write latest.json (needs the release environment secrets). Off: unsigned installer, no auto-update manifest"
        required: true
        default: true
        type: boolean
      run_tests:
        description: "Run the full test suites before building"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    environment: ${{ (github.event_name == 'push' || inputs.signed) && 'release' || 'release-unsigned' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version
        id: v
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
          SIGNED: ${{ github.event_name == 'push' || inputs.signed }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RUN_TESTS: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: |
          $version = $env:REQUESTED.Trim() -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') {
            throw "'$($env:REQUESTED)' is not a valid version. Use X.Y.Z or X.Y.Z-prerelease, for example 1.4.0 or 1.4.0-beta.1."
          }
          $tag = "v$version"
          if ($env:PUBLISH -eq 'true') {
            git fetch --tags --quiet
            if (git tag --list $tag) {
              if ("${{ github.event_name }}" -ne 'push') { throw "Tag $tag already exists. Pick a new version, or turn publish off to only build it." }
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "signed=$($env:SIGNED)" >> $env:GITHUB_OUTPUT
          "publish=$($env:PUBLISH)" >> $env:GITHUB_OUTPUT
          "run_tests=$($env:RUN_TESTS)" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag from $(git rev-parse --short HEAD) (signed=$($env:SIGNED), publish=$($env:PUBLISH))"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix apps/desktop

      - name: Stamp version ${{ steps.v.outputs.version }} into the app
        run: |
          python scripts/set-version.py "${{ steps.v.outputs.version }}"
          python scripts/set-version.py --check

      - name: Tests
        if: steps.v.outputs.run_tests == 'true'
        run: |
          npm run test:python
          npm run typecheck
          npm run test:desktop

      - name: Require signing secrets for a signed build
        if: steps.v.outputs.signed == 'true'
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is not set in the 'release' environment. Add it, or re-run with 'signed' turned off for an unsigned installer." }

      - name: Build packaged service, smoke test, and installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ steps.v.outputs.signed }}" -eq 'true') { ./scripts/build-release.ps1 -SkipTests }
          else { ./scripts/build-release.ps1 -SkipTests -Unsigned }

      - name: Updater manifest (latest.json)
        if: steps.v.outputs.signed == 'true'
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          @{
            version = "${{ steps.v.outputs.version }}"
            notes = "See https://github.com/${{ github.repository }}/releases/tag/${{ steps.v.outputs.tag }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $signature.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/$($installer.Name)" } }
          } | ConvertTo-Json -Depth 5 | Set-Content "$bundle/latest.json"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: apps/desktop/src-tauri/target/release/bundle/nsis/SBOM-${{ steps.v.outputs.tag }}.spdx.json

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataforge-${{ steps.v.outputs.version }}-windows-${{ steps.v.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/SBOM-*.spdx.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ steps.v.outputs.sha }}
          name: DataForge ${{ steps.v.outputs.version }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' || steps.v.outputs.signed != 'true' }}
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/SBOM-*.spdx.json

      # Beta channel clients read latest.json from a rolling "beta" release; stable reads releases/latest.
      - name: Update beta channel manifest
        if: steps.v.outputs.publish == 'true' && steps.v.outputs.signed == 'true' && steps.v.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta channel
          prerelease: true
          make_latest: false
          files: apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
