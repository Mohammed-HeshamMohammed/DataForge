name: Release

# Protected release tags only. Configure a "release" environment with required reviewers and store
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD as environment secrets (never repository secrets).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix apps/desktop

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $version" }

      - name: Tests
        run: |
          npm run test:python
          npm run typecheck
          npm run test:desktop

      - name: Build packaged service, smoke test, and signed installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -SkipTests

      - name: Updater manifest (latest.json)
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $version = "${{ github.ref_name }}".TrimStart("v")
          @{
            version = $version
            notes = "See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $signature.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)" } }
          } | ConvertTo-Json -Depth 5 | Set-Content "$bundle/latest.json"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: apps/desktop/src-tauri/target/release/bundle/nsis/SBOM-${{ github.ref_name }}.spdx.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/SBOM-*.spdx.json

      # Beta channel clients read latest.json from a rolling "beta" release; stable reads releases/latest.
      - name: Update beta channel manifest
        if: contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta channel
          prerelease: true
          make_latest: false
          files: apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
