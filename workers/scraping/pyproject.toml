[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge-scraping-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12", "httpx>=0.27", "cryptography>=42", "truststore>=0.10", "hishel>=1.3", "lxml>=6", "parsel>=1.11", "selectolax>=0.4",
    "protego>=0.6", "feedparser>=6.0", "extruct>=0.18", "mf2py>=2.0", "trafilatura>=2.2", "htmldate>=1.10", "markdownify>=1.2", "autoscraper>=1.1",
    "phonenumbers>=9", "usaddress>=0.5", "price-parser>=0.5", "dateparser>=1.4", "tldextract>=5.3", "pdfplumber>=0.11", "warcio>=1.8",
    "scrapy>=2.19", "scrapy-deltafetch>=2.1", "spidermon>=1.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6"]
tables = ["camelot-py>=2.0"]
docling = ["docling>=2.127"]
language = ["lingua-language-detector>=2.2"]
ocr = ["pytesseract>=0.3.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge_scraping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
