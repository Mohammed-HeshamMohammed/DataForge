[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge-scraping-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge_scraping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
