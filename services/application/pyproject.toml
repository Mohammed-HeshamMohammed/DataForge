[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge-application"
version = "0.1.0"
description = "Local application services for DataForge"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "dataforge-matching-worker", "dataforge-scraping-worker"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge_application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../workers/matching/src", "../../workers/scraping/src"]
