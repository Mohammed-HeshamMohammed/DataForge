[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "Scrape, match, deduplicate and enter records — a versatile data platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hesham" }]
keywords = ["deduplication", "entity-resolution", "scraping", "automation", "etl"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "rapidfuzz>=3.6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
scraping = ["beautifulsoup4>=4.12", "lxml>=5.1", "html5lib>=1.1"]
automation = ["selenium>=4.19", "webdriver-manager>=4.0"]
scheduler = ["apscheduler>=3.10"]
desktop = ["customtkinter>=5.2"]
excel = ["openpyxl>=3.1"]
pdf = ["reportlab>=4.1", "tabula-py>=2.9"]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.3",
  "mypy>=1.9",
  "types-PyYAML",
]
all = [
  "dataforge[ml,web,scraping,automation,scheduler,desktop,excel,pdf]",
]

[project.scripts]
dataforge = "dataforge.cli:app"

[project.urls]
Repository = "https://github.com/Mohammed-HeshamMohammed/DataForge"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.setuptools.package-data]
"dataforge.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: runs against the real exports in Data/; skipped when absent",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI and Typer declare parameter metadata as call defaults by design.
"dataforge/web/api/routes.py" = ["B008"]
"dataforge/cli.py" = ["B008", "UP007", "UP045"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
