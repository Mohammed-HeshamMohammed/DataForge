[package]
name = "dataforge-desktop"
version = "0.1.0"
description = "DataForge local-first desktop application"
authors = ["DataForge"]
edition = "2021"

[lib]
name = "dataforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables native child webviews (Window::add_child) used by Scrape Studio.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
